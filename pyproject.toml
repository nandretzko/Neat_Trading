[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neat-trading"
version = "0.1.0"
description = "NEAT-based stock trading agent — implementation of arXiv 2501.14736"
requires-python = ">=3.10"
dependencies = [
    "neat-python>=0.92",
    "yfinance>=0.2.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]        # makes neat_trader importable without install
addopts    = "-v --tb=short"

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/neat_trader"]
omit   = ["tests/*", "data/*", "checkpoints/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
